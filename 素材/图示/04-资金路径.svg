<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" role="img" aria-labelledby="title desc"><title id="title">先选收入入口，再安排资金</title><desc id="desc">收入可通过支持的支付商或银行直接收取，再按具体需求用于消费、现金储备或符合条件的投资。每条连线需要满足账户与资金用途条件。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#718793"/></marker></defs><rect width="1080" height="1200" fill="#F3F7F5"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="75" font-size="24" fill="#527268" font-weight="600">全球金融基础设施 · 第四章</text><text x="60" y="145" font-size="48" fill="#183344" font-weight="700">先选收入入口，再安排资金</text><text x="60" y="194" font-size="26" fill="#59727A" font-weight="400">替代路径示意：并非必须逐个经过</text><rect x="220" y="244" width="640" height="122" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="338" y="295" font-size="34" fill="#183344" font-weight="700">客户、工资或平台收入</text><text x="347" y="338" font-size="26" fill="#183344" font-weight="400">付款方支持哪些收款渠道？</text><path d="M 540 368 L 540 407 L 210 407 L 210 454 M 540 407 L 540 454 M 540 407 L 870 407 L 870 454" stroke="#718793" stroke-width="3" fill="none"/><path d="M 210 427 L 210 454" stroke="#718793" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="56" y="464" width="308" height="146" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="91" y="524" font-size="34" fill="#327C66" font-weight="700">PayPal</text><text x="91" y="567" font-size="24" fill="#183344" font-weight="400">在线交易收款</text><path d="M 210 612 L 210 660" stroke="#718793" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M 540 427 L 540 454" stroke="#718793" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="386" y="464" width="308" height="146" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="421" y="524" font-size="34" fill="#327C66" font-weight="700">Wise</text><text x="421" y="567" font-size="24" fill="#183344" font-weight="400">受支持的转账收款</text><path d="M 540 612 L 540 660" stroke="#718793" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M 870 427 L 870 454" stroke="#718793" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="716" y="464" width="308" height="146" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="751" y="524" font-size="34" fill="#327C66" font-weight="700">其他支付商</text><text x="751" y="567" font-size="24" fill="#183344" font-weight="400">平台指定渠道</text><path d="M 870 612 L 870 660" stroke="#718793" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M 210 655 L 870 655 M 540 655 L 540 720" stroke="#718793" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="180" y="734" width="720" height="128" rx="24" fill="#E6EFEB" stroke="#D2E0DA" stroke-width="2"/><text x="347" y="787" font-size="36" fill="#183344" font-weight="700">可用的银行账户</text><text x="299" y="829" font-size="26" fill="#183344" font-weight="400">按支持币种与到账条件接收款项</text><path d="M 862 304 L 1028 304 L 1028 798 L 902 798" stroke="#718793" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow)"/><text x="918" y="394" font-size="25" fill="#183344" font-weight="400">也可</text><text x="918" y="432" font-size="25" fill="#183344" font-weight="400">银行直收</text><path d="M 540 864 L 540 916 L 210 916 L 210 954 M 540 916 L 540 954 M 540 916 L 870 916 L 870 954" stroke="#718793" stroke-width="3" fill="none"/><path d="M 210 930 L 210 954" stroke="#718793" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="56" y="964" width="308" height="115" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="91" y="1007" font-size="31" fill="#183344" font-weight="700">消费</text><text x="91" y="1051" font-size="24" fill="#183344" font-weight="400">未来的支出货币</text><path d="M 540 930 L 540 954" stroke="#718793" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="