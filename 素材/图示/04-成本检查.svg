<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" role="img" aria-labelledby="title desc"><title id="title">别只看手续费，看最后到账多少</title><desc id="desc">收款、换汇、提现及中转银行可能产生不同成本，应在相同汇出金额、到账币种和时间要求下比较最终到账金额。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#718793"/></marker></defs><rect width="1080" height="1200" fill="#F3F7F5"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="75" font-size="24" fill="#527268" font-weight="600">全球金融基础设施 · 第四章</text><text x="60" y="145" font-size="48" fill="#183344" font-weight="700">别只看手续费，看最后到账多少</text><text x="60" y="194" font-size="26" fill="#59727A" font-weight="400">跨境付款的四个成本检查点</text><rect x="60" y="240" width="960" height="124" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="90" y="307" font-size="40" fill="#327C66" font-weight="700">01</text><text x="180" y="289" font-size="31" fill="#183344" font-weight="700">收款费用</text><text x="180" y="333" font-size="27" fill="#183344" font-weight="400">商业交易、入账或特定收款方式的费用</text><rect x="60" y="385" width="960" height="124" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="90" y="452" font-size="40" fill="#327C66" font-weight="700">02</text><text x="180" y="434" font-size="31" fill="#183344" font-weight="700">换汇成本</text><text x="180" y="478" font-size="27" fill="#183344" font-weight="400">比较实际兑换汇率与最终到账金额</text><rect x="60" y="530" width="960" height="124" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="90" y="597" font-size="40" fill="#327C66" font-weight="700">03</text><text x="180" y="579" font-size="31" fill="#183344" font-weight="700">提现与转账费用</text><text x="180" y="623" font-size="27" fill="#183344" font-weight="400">看清固定费用、比例费用与适用渠道</text><rect x="60" y="675" width="960" height="124" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><text x="90" y="742" font-size="40" fill="#327C66" font-weight="700">04</text><text x="180" y="724" font-size="31" fill="#183344" font-weight="700">中转与银行费用</text><text x="180" y="768" font-size="27" fill="#183344" font-weight="400">核对中间机构及收款银行是否另收费</text><rect x="60" y="856" width="960" height="214" rx="24" fill="#E6EFEB" stroke="#E6EFEB" stroke-width="2"/><text x="90" y="910" font-size="32" fill="#183344" font-weight="700">比较同样的汇出金额、到账币种与时间需求</text><text x="90" y="964" font-size="29" fill="#183344" font-weight="400">最终到账多少，比“零手续费”更有解释力。</text><text x="90" y="1022" font-size="26" fill="#527268" font-weight="400">费用需换算到同一口径；具体报价以实际交易为准。</text><text x="60" y="1128" font-size="24" fill="#59727A" font-weight="400">功能关系图 · 具体资格与条款需分别核实</text><text x="60" y="1170" font-size="21" fill="#718793" font-weight="400">linshenwuqi / global-finance-infrastructure · 2026-10-12</text></g></svg>
