<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1200" viewBox="0 0 1080 1200" role="img" aria-labelledby="title desc"><title id="title">四类账户，四种主要用途</title><desc id="desc">PayPal侧重在线付款，Wise侧重跨境支付，香港银行提供存款支付，证券服务机构提供投资功能。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#718793"/></marker></defs><rect width="1080" height="1200" fill="#F3F7F5"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="60" y="75" font-size="24" fill="#527268" font-weight="600">全球金融基础设施 · 第四章</text><text x="60" y="145" font-size="48" fill="#183344" font-weight="700">四类账户，四种主要用途</text><text x="60" y="194" font-size="26" fill="#59727A" font-weight="400">从实际需求出发，不从 App 名字出发</text><rect x="60" y="242" width="468" height="318" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><rect x="60" y="242" width="468" height="10" rx="5" fill="#3B629C"/><text x="88" y="309" font-size="38" fill="#3B629C" font-weight="700">PayPal</text><text x="88" y="354" font-size="28" fill="#183344" font-weight="600">在线收银台</text><text x="88" y="421" font-size="25" fill="#183344" font-weight="400">客户付款与商户收款</text><text x="88" y="466" font-size="25" fill="#183344" font-weight="400">先看交易与提现规则</text><text x="88" y="511" font-size="25" fill="#183344" font-weight="400">收到通知 ≠ 已可提现</text><rect x="552" y="242" width="468" height="318" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><rect x="552" y="242" width="468" height="10" rx="5" fill="#327C66"/><text x="580" y="309" font-size="38" fill="#327C66" font-weight="700">Wise</text><text x="580" y="354" font-size="28" fill="#183344" font-weight="600">跨境支付通道</text><text x="580" y="421" font-size="25" fill="#183344" font-weight="400">收款信息、换汇、转账</text><text x="580" y="466" font-size="25" fill="#183344" font-weight="400">功能依地区与账户而异</text><text x="580" y="511" font-size="25" fill="#183344" font-weight="400">收款信息 ≠ 银行账户</text><rect x="60" y="586" width="468" height="318" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><rect x="60" y="586" width="468" height="10" rx="5" fill="#8E624B"/><text x="88" y="653" font-size="38" fill="#8E624B" font-weight="700">香港银行</text><text x="88" y="698" font-size="28" fill="#183344" font-weight="600">存款与支付节点</text><text x="88" y="765" font-size="25" fill="#183344" font-weight="400">管理现金与多币种余额</text><text x="88" y="810" font-size="25" fill="#183344" font-weight="400">核对账户条款与费用</text><text x="88" y="855" font-size="25" fill="#183344" font-weight="400">银行也可能提供证券服务</text><rect x="552" y="586" width="468" height="318" rx="24" fill="#FFFFFF" stroke="#DCE6E8" stroke-width="2"/><rect x="552" y="586" width="468" height="10" rx="5" fill="#796093"/><text x="580" y="653" font-size="38" fill="#796093" font-weight="700">证券服务</text><text x="580" y="698" font-size="28" fill="#183344" font-weight="600">投资账户</text><text x="580" y="765" font-size="25" fill="#183344" font-weight="400">持有股票、ETF、债券</text><text x="580" y="810" font-size="25" fill="#183344" font-weight="400">核对投资资格与托管</text><text x="580" y="855" font-size="25" fill="#183344" font-weight="400">证券持仓 ≠ 银行存款</text><rect x="60" y="968" width="960" height="102" rx="24" fill="#E6EFEB" stroke="#E6EFEB" stroke-width="2"/><text x="88" y="1008" font-size="29" fill="#183344" font-weight="600">同样显示 USD，用途与资金保障也可能不同。</text><text x="88" y="1049" font-size="25" fill="#527268" font-weight="400">先判断自己需要收款、换汇、存款，还是投资。</text><text x="60" y="1128" font-size="24" fill="#59727A" font-weight="400">功能关系图 · 具体资格与条款需分别核实</text><text x="60" y="1170" font-size="21" fill="#718793" font-weight="400">linshenwuqi / global-finance-infrastructure · 2026-10-12</text></g></svg>
